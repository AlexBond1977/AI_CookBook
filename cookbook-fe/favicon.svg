<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- Фон-«плита» с тёплым акцентом -->
    <rect width="64" height="64" rx="14" fill="#e07a3f"/>

    <!-- Тарелка -->
    <circle cx="32" cy="34" r="18" fill="#fff7ec"/>

    <!-- Вилка (слева) -->
    <g fill="#3a2a1e">
        <rect x="12" y="20" width="3" height="20" rx="1.5"/>
        <rect x="9"  y="20" width="2" height="7"  rx="1"/>
        <rect x="13" y="20" width="2" height="7"  rx="1"/>
        <rect x="17" y="20" width="2" height="7"  rx="1"/>
    </g>

    <!-- Ложка (справа) -->
    <g fill="#3a2a1e">
        <rect x="49" y="20" width="3" height="22" rx="1.5"/>
        <ellipse cx="50.5" cy="24" rx="5" ry="6"/>
    </g>
</svg>